<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- السطر التالي لضمان ظهور الكود بشكل صحيح على شاشات الموبايل -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقياس الاتزان الرقمي</title>
    <style>
        :root { --pink: #fce4ec; --blue: #e3f2fd; --accent: #2196f3; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, var(--pink), var(--blue)); display: flex; justify-content: center; padding: 10px; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 600px; width: 100%; position: relative; box-sizing: border-box; }
        .q-box { background: #fafafa; padding: 15px; margin-bottom: 15px; border-radius: 10px; border-right: 5px solid #f06292; }
        label { display: block; margin-bottom: 15px; font-weight: bold; line-height: 1.4; font-size: 1rem; }
        input[type="range"] { width: 100%; accent-color: var(--accent); height: 25px; }
        .score-val { font-weight: bold; color: var(--accent); float: left; background: #e3f2fd; padding: 2px 10px; border-radius: 5px; }
        button { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 1.1rem; }
        #timer { position: sticky; top: 0; background: #ff5252; color: white; padding: 12px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 15px; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #result { display: none; margin-top: 20px; text-align: center; border: 3px solid var(--accent); padding: 20px; border-radius: 15px; background: #fff; }
        .status-msg { font-size: 1.2rem; margin-top: 15px; font-weight: bold; }
        #already-submitted, #time-restriction { display: none; text-align: center; padding: 30px 10px; }
    </style>
</head>
<body>

<div id="main-container" class="card">
    <!-- الرسالة التي تظهر إذا كان الطالب قد شارك مسبقاً -->
    <div id="already-submitted">
        <h2>عذراً! ✋</h2>
        <p>لقد شاركت في هذه الجولة مسبقاً.</p>
    </div>

    <!-- الرسالة التي تظهر إذا كان الوقت غير مسموح به -->
    <div id="time-restriction">
        <h2>الاختبار غير متاح الآن 🕒</h2>
        <p id="time-msg-display"></p> <!-- سيتم تعبئة هذا النص من خلال الـ JavaScript بالأسفل -->
    </div>

    <!-- واجهة الاختبار الرئيسية -->
    <div id="quiz-ui">
        <div id="timer">جاري التحقق من الوقت...</div>
        <h1>مقياس الاتزان الرقمي</h1>
        <div id="quiz"></div>
        <button id="submitBtn" onclick="submitData()">إظهار نتيجتي</button>
        
        <div id="result">
            <h2 id="scoreDisplay"></h2>
            <div id="msgDisplay" class="status-msg"></div>
            <p style="color: #95a5a6; font-size: 0.8rem; margin-top: 20px;">تم تسجيل ردك تلقائياً.</p>
        </div>
    </div>
</div>

<script>
    /* 
       ====================================================
       1. تعديل إعدادات الدورة والوقت من هنا
       ====================================================
    */

    // لتغيير رقم الدورة، غير الرقم بين القوسين ""
    const currentExperimentVersion = "12"; 

    // إعدادات وقت البداية (بنظام 24 ساعة)
    const startHour = 18;  // الساعة 10
    const startMin  = 20;  // الدقيقة 30

    // إعدادات وقت النهاية (بنظام 24 ساعة)
    const endHour   = 00;  // الساعة 10
    const endMin    = 01;  // الدقيقة 45 (لو تريدين الساعة واحدة ظهراً اجعليها 13:00)

    /* 
       ====================================================
       نهاية منطقة التعديل السهلة - لا تغير شيئاً بالأسفل 
       ====================================================
    */

    // تحديث نص رسالة الوقت تلقائياً بناءً على تعديلاتك بالأعلى
    document.getElementById('time-msg-display').innerHTML = `يفتح الاختبار من الساعة <b>${startHour}:${startMin}</b> حتى الساعة <b>${endHour}:${endMin}</b>.`;

    const storageKey = 'digital_scale_v' + currentExperimentVersion;
    const now = new Date();
    const currentTotalMinutes = (now.getHours() * 60) + now.getMinutes();
    const startRange = (startHour * 60) + startMin; 
    const endRange = (endHour * 60) + endMin;   

    const isWithinTimeRange = (currentTotalMinutes >= startRange && currentTotalMinutes < endRange);

    // التحقق من الشروط قبل البدء
    if (!isWithinTimeRange) {
        document.getElementById('quiz-ui').style.display = 'none';
        document.getElementById('time-restriction').style.display = 'block';
    } else if (localStorage.getItem(storageKey)) {
        document.getElementById('quiz-ui').style.display = 'none';
        document.getElementById('already-submitted').style.display = 'block';
    }

    const questions = [
        "صعوبة التركيز لأكثر من 10 دقائق؟", 
        "تعاني من التشوش الذهني، النسيان، وبطء التفكير؟", 
        "سرعة الشعور بالملل؟",
        "الغرق في 'التمرير اللانهائي'( مثل كثرة استخدام انستجرام) ؟", 
        "استخدام لغة 'الميمز' في الواقع؟", 
        "الهروب من المهام الجادة؟",
        "القلق عند الجلوس في الهدوء؟", 
        "ملل الهوايات التقليدية؟", 
        "استخدام الهاتف قبل النوم؟",
        "الشعور بالتوتر عند الابتعاد عن الهاتف؟"
    ];

    const container = document.getElementById('quiz');
    questions.forEach((q, i) => {
        container.innerHTML += `
            <div class="q-box">
                <span class="score-val" id="val-${i}">5</span>
                <label>${i+1}. ${q}</label>
                <input type="range" class="val" min="0" max="10" value="5" oninput="updateVal(${i}, this.value)">
            </div>`;
    });

    function updateVal(id, value) { document.getElementById(`val-${id}`).innerText = value; }

    // ضبط العداد الزمني
    const endTime = new Date();
    endTime.setHours(endHour, endMin, 0); 

    let studentDeadline = new Date().getTime() + (5 * 60 * 1000); 
    if (studentDeadline > endTime.getTime()) {
        studentDeadline = endTime.getTime();
    }

    const countdown = setInterval(() => {
        const currentTime = new Date().getTime();
        let timeLeft = Math.floor((studentDeadline - currentTime) / 1000);

        if (timeLeft <= 0) {
            clearInterval(countdown);
            document.getElementById('timer').innerText = "انتهى الوقت!";
            submitData(true);
            return;
        }

        let mins = Math.floor(timeLeft / 60);
        let secs = timeLeft % 60;
        document.getElementById('timer').innerText = `الوقت المتبقي: ${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }, 1000);

    function submitData(isAuto = false) {
        if (localStorage.getItem(storageKey)) return;
        clearInterval(countdown);

        const scores = Array.from(document.querySelectorAll('.val')).map(i => parseInt(i.value));
        const totalRaw = scores.reduce((a, b) => a + b, 0);
        const finalScore = parseFloat(((totalRaw / 100) * 4).toFixed(1)); 
        
        document.getElementById('quiz').style.display = 'none';
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('timer').style.display = 'none';
        document.getElementById('result').style.display = 'block';
        
        document.getElementById('scoreDisplay').innerText = `نتيجتك: ${finalScore} من 4`;
        
        let msg = ""; let color = "";
        if(finalScore <= 1.5) { msg = "✅ ممتاز! أنت مسيطر~"; color = "#2ecc71"; }
        else if(finalScore <= 2.8) { msg = "⚠️ متوسط. انتبه لتشتتك."; color = "#f39c12"; }
        else { msg = "🚨 أنت في المنطقة الحمراء!"; color = "#e74c3c"; }
        
        const msgDiv = document.getElementById('msgDisplay');
        msgDiv.innerHTML = msg; msgDiv.style.color = color;

        localStorage.setItem(storageKey, 'true');

        const formURL = "https://docs.google.com/forms/d/e/1FAIpQLSe8icJBiyNeApAblKUIJKXEgVenqXhBYZanwQibZalbLNSTCw/formResponse";
        const data = new FormData();
        data.append("entry.1122387086", finalScore);
        data.append("entry.931849774", currentExperimentVersion); 

        fetch(formURL, { method: "POST", mode: "no-cors", body: data });
    }
</script>
</body>
</html>
